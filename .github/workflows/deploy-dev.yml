name: Deploy Bundle to Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/.databricks/bin" >> "$GITHUB_PATH"

      - name: Install uv build tool
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy bundle to dev
        run: |
          databricks bundle deploy -t dev
          echo "Deployment complete for target=dev"

      - name: Collect deployment summary
        id: bundle_summary
        run: |
          SUMMARY=$(databricks bundle summary -t dev --output json)
          echo "$SUMMARY" > bundle-summary.json
          echo "Bundle summary for target=dev"
          jq -r '.resources | to_entries[] | "Resource group: \(.key)"' bundle-summary.json
          JOB_ID=$(jq -r '.resources.jobs.sample_job.id' bundle-summary.json)
          PIPELINE_ID=$(jq -r '.resources.pipelines.cicd_dbs_etl.id' bundle-summary.json)
          echo "Job resource id: $JOB_ID"
          echo "Pipeline resource id: $PIPELINE_ID"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "pipeline_id=$PIPELINE_ID" >> "$GITHUB_OUTPUT"

      - name: Run sample_job (dev)
        id: run_job
        env:
          JOB_ID: ${{ steps.bundle_summary.outputs.job_id }}
        run: |
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Job id is missing from bundle summary"
            exit 1
          fi
          RUN_RESPONSE=$(databricks jobs run-now "$JOB_ID" --output json)
          echo "$RUN_RESPONSE" > run-response.json
          RUN_ID=$(jq -r '.run_id' run-response.json)
          echo "Triggered Databricks job run_id=$RUN_ID"
          ATTEMPTS=0
          while true; do
            STATUS=$(databricks jobs get-run "$RUN_ID")
            echo "$STATUS" > run-status.json
            LIFE=$(jq -r '.state.life_cycle_state' run-status.json)
            RESULT=$(jq -r '.state.result_state // ""' run-status.json)
            echo "Current state: $LIFE / $RESULT"
            if [ "$LIFE" = "TERMINATED" ]; then
              if [ "$RESULT" = "SUCCESS" ]; then
                RUN_MODE=$(jq -r '
                  (.job_parameters
                    | if type == "object" then .run_mode
                      elif type == "array" then
                        (map(select(.name == "run_mode")) | (.[0].value // empty))
                      else null end
                  ) // "sample"
                ' run-status.json)
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                echo "run_mode=$RUN_MODE" >> "$GITHUB_OUTPUT"
                cat run-status.json
                break
              else
                cat run-status.json
                exit 1
              fi
            elif [ "$LIFE" = "INTERNAL_ERROR" ] || [ "$LIFE" = "SKIPPED" ]; then
              cat run-status.json
              exit 1
            fi
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ $ATTEMPTS -gt 40 ]; then
              echo "Run polling timed out"
              exit 1
            fi
            sleep 15
          done

      - name: Verify dev run output
        env:
          RUN_ID: ${{ steps.run_job.outputs.run_id }}
          EXPECTED_RUN_MODE: sample
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "Run id missing; cannot verify output"
            exit 1
          fi
          databricks jobs runs get "$RUN_ID" --output json > run-status.json
          TASK_RUN_ID=$(jq -r '.tasks[] | select(.task_key == "python_wheel_task") | .run_id' run-status.json)
          if [ -z "$TASK_RUN_ID" ] || [ "$TASK_RUN_ID" = "null" ]; then
            echo "Unable to find python_wheel_task run id"
            cat run-status.json
            exit 1
          fi
          databricks jobs runs get-output "$TASK_RUN_ID" --output json > run-output.json
          python - <<'PY'
            import json
            import os
            import re

            with open("run-output.json", encoding="utf-8") as fh:
              data = json.load(fh)

            logs = data.get("logs") or ""
            print(logs)

            row_counts = re.findall(r"VERIFICATION_ROW_COUNT=(\d+)", logs)
            if not row_counts:
              raise SystemExit("Verification marker for row count not found in logs")

            row_count = int(row_counts[-1])
            if row_count <= 0:
              raise SystemExit(f"Row count {row_count} is not greater than zero")

            run_modes = re.findall(r"VERIFICATION_RUN_MODE=([A-Za-z0-9_-]+)", logs)
            if not run_modes:
              raise SystemExit("Verification marker for run mode not found in logs")

            run_mode = run_modes[-1]
            expected = os.environ.get("EXPECTED_RUN_MODE", "sample")
            if run_mode != expected:
              raise SystemExit(
                f"Expected run mode {expected} but job reported {run_mode}"
              )

            print(
              f"Row count validation passed: run_mode={run_mode}, row_count={row_count}"
            )
